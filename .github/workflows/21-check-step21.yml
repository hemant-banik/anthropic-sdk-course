name: "Step 21 - Bedrock and Vertex Clients"

# Disabled by default; enabled by Step 20's workflow. This is the LAST
# step in the full course, so on success it posts the course-complete
# issue instead of a "Step 22" issue and disables itself — exactly
# mirroring what 03-check-step3.yml did before it was rewired to point at
# Step 4 (see that block below, copied verbatim).

on:
  push:
    branches: [main]
    paths:
      - "exercises/practice21_bedrock_vertex.py"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write
  actions: write

concurrency:
  group: course-progress
  cancel-in-progress: false

jobs:
  check_step21:
    name: Verify Step 21 exercise
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install anthropic python-dotenv

      - name: Run checker
        id: run_checker
        run: python .github/scripts/check_step21.py

      - name: Find open Step 21 issue
        if: success()
        id: find_issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          number=$(gh issue list --repo "${{ github.repository }}" --label "step-21" --state open --json number --jq '.[0].number')
          echo "issue_number=$number" >> "$GITHUB_OUTPUT"

      - name: Comment success + close issue
        if: success() && steps.find_issue.outputs.issue_number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ steps.find_issue.outputs.issue_number }}
        run: |
          gh issue comment "$ISSUE" --repo "${{ github.repository }}" --body "✅ **Step 21 complete!** You've finished this course 🎉"
          gh issue close "$ISSUE" --repo "${{ github.repository }}"

      - name: Open course-complete issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count=$(gh issue list --repo "${{ github.repository }}" --label "course-complete" --state all --json number --jq 'length')
          if [ "$count" -eq 0 ]; then
            gh label create "course-complete" --color "0E8A16" --force 2>/dev/null || true
            gh label create "course" --color "5319E7" --force 2>/dev/null || true
            gh issue create \
              --repo "${{ github.repository }}" \
              --title "🎉 Course complete!" \
              --label "course-complete,course" \
              --body-file .github/steps/04-course-complete.md
          fi

      - name: Disable this workflow
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow disable "Step 21 - Bedrock and Vertex Clients" --repo "${{ github.repository }}" || true

      - name: Comment failure reason on issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          number=$(gh issue list --repo "${{ github.repository }}" --label "step-21" --state open --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "${{ github.repository }}" --body "❌ Step 21 check failed. See the [Actions log](../../actions/runs/${{ github.run_id }}) for details, fix your file, and push again."
          fi
